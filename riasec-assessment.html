<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIASEC Assessment — Career Profiling System</title>
<link rel="icon" type="image/png" href="images/admin/logo-profilepath-shield.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/csrf.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
  .font-heading{ font-family:'Poppins', sans-serif; }
</style>
<link rel="stylesheet" href="css/motion.css">
</head>
<body class="bg-white min-h-screen">
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="max-w-[1330px] mx-auto px-6 md:px-10 pt-8 pb-4 flex items-start justify-between gap-6 sticky top-0 bg-white z-10">
  <div class="flex items-center gap-3">
    <button type="button" id="backBtn" class="w-6 h-6 shrink-0 flex items-center justify-center text-[#082672] hover:opacity-70">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h1 class="font-heading text-[#082672] text-2xl md:text-[32px] font-semibold tracking-wide">RIASEC Assessment</h1>
  </div>
  <div class="text-right shrink-0">
    <p class="font-heading text-black text-base md:text-lg font-medium" id="headerName">Student</p>
    <p class="font-heading text-black text-sm md:text-base" id="headerGrade">—</p>
  </div>
</header>

<main id="main-content" class="max-w-[1330px] mx-auto px-6 md:px-10 pb-10">

  <!-- Dimension Tabs -->
  <div id="dimensionTabs" class="flex flex-wrap gap-3 mb-6"></div>

  <!-- Overall Progress -->
  <div class="bg-white border border-black/[0.08] rounded-[20px] px-6 py-4 mb-6 flex items-center gap-4">
    <span class="text-base md:text-lg font-medium text-black shrink-0">Overall Progress</span>
    <div class="flex-1 h-2.5 rounded-full bg-slate-200 overflow-hidden">
      <div id="overallProgressBar" class="h-full rounded-full bg-[#0f2a6b] transition-all duration-300" style="width:0%"></div>
    </div>
    <span class="text-base md:text-lg font-medium text-black shrink-0" id="overallProgressText">1/60</span>
  </div>

  <!-- Question Card -->
  <div id="questionCard" class="content-swap bg-white border border-black/[0.08] rounded-[20px] p-8 md:p-10 min-h-[440px] flex flex-col">
    <p class="text-[#5c5a5a] text-sm md:text-base font-medium mb-3" id="questionMeta">Realistic - Question 1 out of 10</p>
    <h2 class="text-black text-lg md:text-xl font-medium mb-8" id="questionText">—</h2>

    <div id="optionsList" class="flex flex-col gap-4 max-w-[1175px] mx-auto w-full"></div>

    <div class="flex-1"></div>
    <p id="submitError" class="hidden text-sm text-[#ed1c24] text-right mb-2" aria-live="polite"></p>
    <div class="flex justify-end pt-8">
      <button type="button" id="nextBtn" disabled class="flex items-center gap-2 rounded-[15px] px-7 py-2.5 text-base font-medium border border-black/[0.15] bg-white text-[#5c5a5a] cursor-not-allowed transition-colors">
        <span id="nextBtnLabel">Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 icon-nudge-right"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

</main>

<!-- Exit confirmation modal -->
<div id="exitModal" class="modal-backdrop hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="modal-card bg-white rounded-xl shadow-lg w-full max-w-sm p-6 flex flex-col gap-4">
    <h3 class="text-lg font-semibold text-black">Leave the assessment?</h3>
    <p class="text-sm text-[#5c5a5a]">Your progress is saved, so you can pick up right where you left off next time.</p>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" id="exitCancel" class="px-4 py-2 text-sm font-medium text-[#5c5a5a] border border-black/[0.15] rounded-md hover:bg-slate-50">Stay</button>
      <button type="button" id="exitConfirm" class="px-4 py-2 text-sm font-medium text-white bg-[#082672] rounded-md hover:opacity-90">Leave</button>
    </div>
  </div>
</div>

<script>
(async function() {
  const sessionRes = await fetch('api/session.php');
  const sessionData = await sessionRes.json();
  const currentUser = sessionData.user;
  if (!currentUser || currentUser.role !== 'student') {
    window.location.replace('login');
    return;
  }

  document.getElementById('headerName').textContent = currentUser.firstName + ' ' + currentUser.lastName;
  document.getElementById('headerGrade').textContent = 'Grade ' + currentUser.gradeLevel + ' - ' + currentUser.strand;

  const DIMENSIONS = [
    { code: 'R', label: 'Realistic' },
    { code: 'I', label: 'Investigate' },
    { code: 'A', label: 'Artistic' },
    { code: 'S', label: 'Social' },
    { code: 'E', label: 'Enterprising' },
    { code: 'C', label: 'Conventional' }
  ];

  const OPTIONS = ['Dislike', 'Slightly Dislike', 'Neutral', 'Slightly Enjoy', 'Enjoy'];

  const questionsRes = await fetch('api/assessment-questions.php');
  const questionsData = await questionsRes.json();
  const dimensionLabels = Object.fromEntries(DIMENSIONS.map(function(d) { return [d.code, d.label]; }));
  const QUESTIONS = questionsData.questions.map(function(q) {
    return { id: q.id, dimension: q.dimension, label: dimensionLabels[q.dimension], indexInDim: q.orderIndex, text: q.text };
  });
  const TOTAL = QUESTIONS.length;

  const PROGRESS_KEY = 'assessmentProgress_' + currentUser.schoolId;

  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
      if (saved && Array.isArray(saved.answers) && saved.answers.length === TOTAL) return saved;
    } catch (e) {}
    return { answers: new Array(TOTAL).fill(null) };
  }
  function saveProgress(state) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
  }

  const state = loadProgress();
  let currentIndex = state.answers.findIndex(function(a) { return a === null; });
  if (currentIndex === -1) currentIndex = TOTAL - 1;

  function renderTabs() {
    const wrap = document.getElementById('dimensionTabs');
    wrap.innerHTML = DIMENSIONS.map(function(dim) {
      const active = dim.code === QUESTIONS[currentIndex].dimension;
      const cls = active
        ? 'bg-[#94aae0] text-white font-bold'
        : 'bg-white text-black border border-[#d9d9d9] font-medium';
      return '<span class="' + cls + ' rounded-full px-6 py-3 text-sm md:text-base whitespace-nowrap">' + dim.label + '</span>';
    }).join('');
  }

  function renderOptions() {
    const list = document.getElementById('optionsList');
    const selected = state.answers[currentIndex];
    list.innerHTML = OPTIONS.map(function(label, i) {
      const value = i + 1;
      const isSelected = selected === value;
      const rowCls = isSelected
        ? 'bg-[#e7ecfa] border-[#0f2a6b]'
        : 'bg-[#f1f4fc] border-black/[0.08] hover:border-black/[0.2]';
      const dotCls = isSelected ? 'border-[#0f2a6b]' : 'border-black/40';
      const dotInner = isSelected ? '<span class="w-2.5 h-2.5 rounded-full bg-[#0f2a6b]"></span>' : '';
      const popCls = isSelected ? ' option-selected-pop' : '';
      return '<button type="button" data-value="' + value + '" class="option-row flex items-center gap-4 border rounded-[13px] h-14 px-5 text-left text-base text-black transition-colors ' + rowCls + popCls + '">' +
        '<span class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ' + dotCls + '">' + dotInner + '</span>' +
        label +
        '</button>';
    }).join('');

    list.querySelectorAll('.option-row').forEach(function(btn) {
      btn.addEventListener('click', function() {
        state.answers[currentIndex] = parseInt(btn.dataset.value, 10);
        saveProgress(state);
        renderOptions();
        updateNextButton();
      });
    });
  }

  function updateNextButton() {
    const btn = document.getElementById('nextBtn');
    const answered = state.answers[currentIndex] !== null;
    btn.disabled = !answered;
    if (answered) {
      btn.className = 'flex items-center gap-2 rounded-[15px] px-7 py-2.5 text-base font-medium border border-[#0f2a6b] bg-[#0f2a6b] text-white transition-colors hover:opacity-90';
    } else {
      btn.className = 'flex items-center gap-2 rounded-[15px] px-7 py-2.5 text-base font-medium border border-black/[0.15] bg-white text-[#5c5a5a] cursor-not-allowed transition-colors';
    }
    document.getElementById('nextBtnLabel').textContent = currentIndex === TOTAL - 1 ? 'Finish' : 'Next';
  }

  function renderQuestion() {
    const q = QUESTIONS[currentIndex];
    document.getElementById('questionMeta').textContent = q.label + ' - Question ' + q.indexInDim + ' out of 10';
    document.getElementById('questionText').textContent = q.text;
    document.getElementById('overallProgressText').textContent = (currentIndex + 1) + '/' + TOTAL;
    document.getElementById('overallProgressBar').style.width = ((currentIndex) / TOTAL * 100) + '%';
    renderTabs();
    renderOptions();
    updateNextButton();
  }

  function showSubmitError(text) {
    const el = document.getElementById('submitError');
    el.textContent = text;
    el.classList.remove('hidden');
  }

  document.getElementById('nextBtn').addEventListener('click', async function() {
    if (state.answers[currentIndex] === null) return;

    if (currentIndex === TOTAL - 1) {
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = true;
      try {
        const res = await fetch('api/assessment-submit.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: state.answers })
        });
        const data = await res.json();
        if (!data.success) {
          showSubmitError(data.error || 'Failed to submit assessment. Please try again.');
          nextBtn.disabled = false;
          return;
        }
        localStorage.removeItem(PROGRESS_KEY);
        window.location.href = 'results';
      } catch (err) {
        showSubmitError('Unable to reach the server. Please try again.');
        nextBtn.disabled = false;
      }
      return;
    }

    const card = document.getElementById('questionCard');
    card.classList.add('is-swapping');
    setTimeout(function() {
      currentIndex++;
      saveProgress(state);
      renderQuestion();
      card.classList.remove('is-swapping');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  });

  const exitModal = document.getElementById('exitModal');
  function openExitModal() {
    exitModal.classList.remove('hidden');
    setTimeout(function() {
      exitModal.classList.add('is-open');
    }, 16);
  }
  function closeExitModal() {
    exitModal.classList.remove('is-open');
    setTimeout(function() { exitModal.classList.add('hidden'); }, 260);
  }
  document.getElementById('backBtn').addEventListener('click', openExitModal);
  document.getElementById('exitCancel').addEventListener('click', closeExitModal);
  document.getElementById('exitConfirm').addEventListener('click', function() {
    window.location.href = 'assessment';
  });
  exitModal.addEventListener('click', function(e) {
    if (e.target.id === 'exitModal') closeExitModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !exitModal.classList.contains('hidden')) closeExitModal();
  });

  renderQuestion();
})();
</script>

<script src="js/motion.js" defer></script>
</body>
</html>
