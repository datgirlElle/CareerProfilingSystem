<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Career Profiling System</title>
<link rel="icon" type="image/png" href="images/admin/logo-profilepath-shield.png">
<link rel="stylesheet" href="css/tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
  .font-heading{ font-family:'Poppins', sans-serif; }
</style>
<link rel="stylesheet" href="css/motion.css">
</head>
<body class="bg-[#f8f9fb] min-h-screen">
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="max-w-[600px] mx-auto px-6 pt-8 pb-4 flex items-center gap-3">
  <a href="student-settings" class="w-6 h-6 shrink-0 flex items-center justify-center text-[#082672] hover:opacity-70">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </a>
  <h1 class="font-heading text-[#082672] text-xl md:text-2xl font-semibold">Change Password</h1>
</header>

<main id="main-content" class="max-w-[520px] mx-auto px-6 pb-16">

  <!-- Step 1: New password -->
  <div id="stepPassword" class="bg-white border border-black/[0.08] rounded-[20px] p-8 flex flex-col items-center gap-6">
    <div class="w-16 h-16 rounded-xl bg-[#eef1fb] flex items-center justify-center">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f2a6b" stroke-width="2" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <div class="text-center">
      <h2 class="text-lg font-semibold text-[#191c1e]">Set a New Password</h2>
      <p class="text-sm text-[#5c5a5a] mt-1">Choose a new password for your account.</p>
    </div>

    <form id="passwordForm" class="w-full flex flex-col gap-4">
      <p id="passwordError" class="hidden text-sm text-[#ed1c24] bg-red-50 border border-red-100 rounded-md px-3.5 py-2.5"></p>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Current Password</label>
        <input type="password" id="currentPassword" required class="w-full border border-gray-300 rounded-md px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">New Password</label>
        <input type="password" id="newPassword" required minlength="6" class="w-full border border-gray-300 rounded-md px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6" class="w-full border border-gray-300 rounded-md px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
      </div>
      <button type="submit" class="w-full bg-[#0f2a6b] text-white text-sm font-semibold rounded-md py-3.5 hover:opacity-90">Change Password</button>
    </form>
  </div>

  <!-- Step 2: Success -->
  <div id="stepDone" class="hidden bg-white border border-black/[0.08] rounded-[20px] p-8 flex flex-col items-center text-center gap-3">
    <span class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </span>
    <h2 class="text-lg font-semibold text-[#191c1e]">Password Changed</h2>
    <p class="text-sm text-[#5c5a5a]">Your password has been updated. Redirecting you back to Settings...</p>
  </div>

</main>

<script>
(async function() {
  const sessionData = await (await fetch('api/session.php')).json();
  const currentUser = sessionData.user;
  if (!currentUser || currentUser.role !== 'student') {
    window.location.replace('login');
    return;
  }

  const stepPassword = document.getElementById('stepPassword');
  const stepDone = document.getElementById('stepDone');

  document.getElementById('passwordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('passwordError');
    errEl.classList.add('hidden');

    const current = document.getElementById('currentPassword').value;
    const next = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (next !== confirm) {
      errEl.textContent = 'New password and confirmation do not match.';
      errEl.classList.remove('hidden');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const res = await fetch('api/change-password.php', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword: current, newPassword: next })
    });
    const data = await res.json();
    submitBtn.disabled = false;

    if (!data.success) {
      errEl.textContent = data.error || 'Failed to change password. Please try again.';
      errEl.classList.remove('hidden');
      return;
    }

    stepPassword.classList.add('hidden');
    stepDone.classList.remove('hidden');

    setTimeout(function() {
      window.location.href = 'student-settings';
    }, 1800);
  });
})();
</script>

<script src="js/motion.js" defer></script>
</body>
</html>
